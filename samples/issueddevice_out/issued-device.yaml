components:
  schemas:
    AccountIdentifier__Base:
      type: object
      properties:
        accountIdentificationType:
          type: string
          description: "Type of the account.By default if not provided, it is a checking account\nPossible
            Values:\nChecking,\nSavings"
          example: Checking
          x-sor-field: accountList.type
      description: Attributes of AccountIdentifier common to every operation that uses it.
      x-class: AccountIdentifier
      x-context: Base
      x-qualified-name: AccountIdentifier~Base
    AccountIdentifier:
      allOf:
      - $ref: '#/components/schemas/AccountIdentifier__Base'
      - type: object
        properties:
          accountIdentification:
            type: string
            maxLength: 24
            description: Account number used for posting to core banking system
            example: 8oYwZq3VZDaq9i
            x-sor-field: accountList.number
        required:
        - accountIdentification
      x-used-by:
      - cardCreate
      x-class: AccountIdentifier
      x-qualified-name: AccountIdentifier
    AccountIdentifier__GetCardDetails:
      allOf:
      - $ref: '#/components/schemas/AccountIdentifier__Base'
      - type: object
        properties:
