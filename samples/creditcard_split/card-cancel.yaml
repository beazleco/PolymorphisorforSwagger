              detail:
                type: string
                description: A more comprehensive explanation of the error, including what went 
                  wrong and how to fix it.
              instance:
                type: string
                description: A URI that identifies the specific occurrence of the problem.
      example:
        status: '400'
        title: Bad Request
        timestamp: '2026-07-14T08:16:49.876Z'
        errors:
        - realm: Apigee
          code: '001'
          errordesc: QUERY_PARAMETER_FAILURE
          detail: The input query parameters do not match the open api spec
          instance: /v1/<resource>/<action>
