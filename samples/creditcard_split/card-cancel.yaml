    put:
      operationId: cardCancel
      summary: This API will be used to cancel a card with specified reason or cancellation code
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardCancelResponse'
