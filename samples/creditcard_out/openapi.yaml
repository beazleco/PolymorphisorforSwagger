openapi: 3.0.3
info:
  title: Credit Card API
  version: 1.0.0
  description: Generated from the SOR mapping workbook. 11 operations across Credit Card. Only 
    attributes mapped to a System of Record field are published; shared groups that differ between 
    operations are specialised with allOf, and operations served by several SOR endpoints carry a 
    requestVariant discriminator.
  x-generated-by: SOR Polymorphizer 6.4
  x-generated-at: '2026-09-09T02:20:52+00:00'
  x-source-sheets:
  - Available Funds_Retrieve
  - Transaction Adjustment_Initiate
  - Recency Check_Retrieve
  - Account Statement_Retrieve
  - Card Transaction_Retrieve
  - Card Details_Retrieve
  - Card issuedDevice_Initiate
  - Card issuedDevice_Update
  - Card Cancel
  - Customer Addl Data
  - Card RSAEncrypted
  x-bian-service-domains:
  - Credit Card
tags:
- name: Credit Card
paths:
  /credit-card/financial-status-tracking/retrieve:
    post:
      operationId: availableFundsRetrieve
      summary: Use this API to retrieve card available funds details
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialStatusTrackingResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialStatusTrackingRequest'
      description: Use this API to retrieve card available funds details
      x-bian-behaviour-qualifier: Financial Status Tracking
      x-sor-endpoints: /v1/card/availableFunds
  /credit-card/card-transaction/adjustment/initiate:
    post:
      operationId: transactionAdjustmentInitiate
      summary: Use this API to post cardholder account adjustment
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransactionAdjustmentResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTransactionAdjustmentRequest'
      description: Use this API to post cardholder account adjustment
      x-bian-behaviour-qualifier: Card Transaction
      x-sor-endpoints: /v1/account/transaction/adjustment
  /credit-card/mobile-recency/retrieve:
    post:
      operationId: recencyCheckRetrieve
      summary: Use this API to perform recency check
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRecencyResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRecencyRequest'
      description: Use this API to perform recency check
      x-bian-behaviour-qualifier: Mobile Recency
      x-sor-endpoints: /v1/card/recencyCheck
  /credit-card/billing/retrieve:
    post:
      operationId: accountStatementRetrieve
      summary: Use this API to retrieve card statement details
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingRequest'
      description: Use this API to retrieve card statement details
      x-bian-behaviour-qualifier: Billing
      x-sor-endpoints: /v1/account/statement
  /CreditCard/CardTransaction/Retrieve:
    post:
      operationId: cardTransactionRetrieve
      summary: This API will be used to retrieve details about a card account transaction
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransactionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTransactionRequest'
      description: This API will be used to retrieve details about a card account transaction
      x-bian-behaviour-qualifier: Card Transaction
      x-bian-equivalent-endpoint: /CreditCard/CardTransaction/Retrieve
      x-sor-endpoints: 'GET: v1/account/search/trans, GET: v1/account/search/auth, GET: /v1/account/search/mps'
  /CreditCard/Account/Retrieve:
    post:
      operationId: cardDetailsRetrieve
      summary: This API will be used to retrieve details about a card account
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardAccountRetrieveResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardAccountRetrieveRequest'
      description: This API will be used to retrieve details about a card account
      x-bian-behaviour-qualifier: Account
      x-bian-equivalent-endpoint: /CreditCard/Account/Retrieve
      x-sor-endpoints: /v1/account/contact /v1/account/delinquency /v1/account/info 
        /v1/account/historyIndicators /v1/card/account/list
  /CreditCard/IssuedDevice/Initiate:
    post:
      operationId: cardIssuedDeviceInitiate
      summary: This API will be used to initiate/enable a type of device for the card account
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDeviceInstanceInitiateResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuedDeviceInstanceInitiateRequest'
      description: This API will be used to initiate/enable a type of device for the card account
      x-bian-behaviour-qualifier: Issued Device
      x-bian-equivalent-endpoint: /CreditCard/IssuedDevice/Initiate
      x-sor-endpoints: 'PUT: /v1/card/activate'
  /CreditCard/IssuedDevice/Update:
    put:
      operationId: cardIssuedDeviceUpdate
      summary: This API will be used to update details for an issued device
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedDeviceInstanceUpdateResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuedDeviceInstanceUpdateRequest'
      description: This API will be used to update details for an issued device
      x-bian-behaviour-qualifier: Issued Device
      x-bian-equivalent-endpoint: /CreditCard/IssuedDevice/Update
      x-sor-endpoints: 'DELETE: /v1/card/cancel'
  /credit-card/issued-device/control:
    put:
      operationId: cardCancel
      summary: This API will be used to cancel a card with specified reason or cancellation code
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCardCancelResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardCancelRequest'
      description: This API will be used to cancel a card with specified reason or cancellation code
      x-bian-behaviour-qualifier: Issued Device
      x-bian-equivalent-endpoint: /credit-card/issued-device/control
      x-sor-endpoints: PUT /v1/card/cancel
  /credit-card/customer/additional-data/retrieve:
    post:
      operationId: customerAddlData
      summary: This API will be used to get the customer additional data for specified customer 
        number or card number
      tags:
      - Credit Card
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardCustomerAdditionalDataResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCustomerAdditionalDataRequest'
      description: This API will be used to get the customer additional data for specified customer 
        number or card number
      x-bian-behaviour-qualifier: '- Additional Data'
      x-bian-equivalent-endpoint: /credit-card/customer/additional-data/retrieve
      x-sor-endpoints: GET /v1/customer/additionalData
  /credit-card/issued-device/card-rsa-encrypted/retrieve:
    post:
      operationId: cardRSAEncrypted
      summary: This API will be used to get the card number encrypted, the expiry date, and 
        optionally the CVV2. Encryption is made via
      tags:
      - Credit Card
      responses:
        '204':
          description: 'Successful. This operation returns no content: the Response Body section of the
            mapping workbook carries no attribute mapped to an SOR field.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuedDeviceCardEncryptedRequest'
      description: This API will be used to get the card number encrypted, the expiry date, and 
        optionally the CVV2. Encryption is made via a Public RSA key base64 encoded in format X.509.
      x-bian-behaviour-qualifier: Issued Device
      x-bian-equivalent-endpoint: /credit-card/issued-device/card-rsa-encrypted/retrieve
      x-sor-endpoints: GET /v1/card/{cardNumber}/cardRSAEncrypted
