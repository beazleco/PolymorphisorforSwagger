      description: Amount and currency of limit utilized for the month.
    AccountReclassification:
      type: object
      properties:
        accountReclassificationValue:
          type: string
          description: Account reclassification code as per CODES type "RECLS"
          x-sor-field: accounts.reclassification.value
        accountReclassificationDescription:
          type: string
          description: The system description of the code
          x-sor-field: accounts.reclassification.description
      description: Reclassification
    AccountStatus:
      type: object
      properties:
        accountStatusTypeValues:
          type: string
          description: The account status
          example: open
          x-sor-field: accountStatus
