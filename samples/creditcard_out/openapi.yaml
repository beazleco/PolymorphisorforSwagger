    AccountTransactionItem:
      allOf:
      - $ref: '#/components/schemas/AccountTransactionItemBase'
      - type: object
        properties:
          CardPaymentTransaction:
            type: array
            items:
              $ref: '#/components/schemas/CardPaymentTransactionItem'
            description: Array for transaction details
      x-used-by:
      - cardTransactionRetrieve
    AccountTransactionItemForCardTransactionRetrieve:
      allOf:
      - $ref: '#/components/schemas/AccountTransactionItemBase'
      - type: object
        properties:
          CardPaymentTransaction:
            type: array
            items:
              $ref: '#/components/schemas/CardPaymentTransactionItemForCardTransactionRetrieve'
            description: Array for transaction details
            x-sor-field: acccountAuthorizations.authorizations
      x-used-by:
      - cardTransactionRetrieve
    AccountTransactionItemForCardTransactionRetrieve2:
      allOf:
      - $ref: '#/components/schemas/AccountTransactionItemBase'
      - type: object
        properties:
          CardPaymentTransaction:
            type: array
            items:
              $ref: '#/components/schemas/CardPaymentTransactionItemForCardTransactionRetrieve2'
            description: Array for transaction details
            x-sor-field: accountMps.mps
      x-used-by:
      - cardTransactionRetrieve
    Accountidentifier:
      type: object
      properties:
        accountIdentification:
          type: string
          description: Vertexon CMS Account ID
          example: '00000000001'
          x-sor-field: account
    AssociationReferenceItem:
      type: object
      properties:
        partyName:
          type: string
          description: It specifies the party name
          x-sor-field: accounts.introducer, accounts.recommendingOfficer, accounts.approvingOfficer
    AutoDebitArrangment:
      type: object
      properties:
        autoDebitArrangementCode:
          type: string
          description: Linked bank account with link codes either L or G (ADA)
          x-sor-field: accounts.bankAccountADA
      description: It specifies the auto debit arrangement facility
    BillingStatementReference:
      type: object
      properties:
        StatementCurrency:
          type: array
          items:
            $ref: '#/components/schemas/StatementCurrencyItem'
          description: Statement Currency Details
        statementCycle:
          type: string
          description: Statement Cycle Day
          example: '1'
          x-sor-field: accountStatementInfo.statementCycle
        statementAccountBalance:
          type: array
          items:
            $ref: '#/components/schemas/statementAccountBalanceItem'
          description: Account Balance Details
        accountOverdueDate:
          type: string
          format: date-time
          description: Date when account became overdue
          example: 2021-08-01 14:20:10:95
          x-sor-field: accountStatementInfo.accountOverdueDate
        LastStatementDetails:
          $ref: '#/components/schemas/LastStatementDetails'
      description: Reference to an associated statement
    CancelReportDetails:
      type: object
      properties:
        reportDate:
          type: string
          format: date
          maxLength: 10
          description: The customer reported date, E.g. if the card has been lost, the date of loss.
          x-sor-field: reportDetails.reportDate
        reportTime:
          type: string
          maxLength: 5
          description: The customer reported time in format HH:MM, E.g. if the card has been lost, 
            the time of loss.
          example: 14:00:00
          x-sor-field: reportDetails.reportTime
        reportMethod:
          type: string
          maxLength: 3
          description: The method used to report the loss/stolen. To obtain the possible values in 
            the system
          example: PHN
          x-sor-field: reportDetails.reportMethod
        dateLastSeen:
          type: string
          format: date
          maxLength: 10
          description: The date reported by customer when card was last seen.
          x-sor-field: reportDetails.reportDateLastSeen
        placeLastSeen:
          type: string
          maxLength: 100
          description: The place reported by customer where card was last seen.
          example: N.Y Central Park
          x-sor-field: reportDetails.reportDatePlaceLastSeen
        reportedBy:
          type: string
          maxLength: 100
          description: The person who reported the issue. Only required if the place the card was 
            last seen is specified.
          example: Mr.Anderson
          x-sor-field: reportDetails.reportedBy
      description: "\nCancellation report details should be sent if required by the specified cancel code,
        e.g. if the card is lost or stolen"
    CardLimit:
      type: object
      properties:
        limitValue:
          type: string
          description: "Value of Limit.\nWhen LimitType = CreditLimit, LimitValue = Credit limit set for
            the account\nWhen LimitType = LimitCash, LimitValue = Cash limit calculated as percentage
            of Credit Limit.\nWhen LimitType = MonthlyLimit, LimitValue = The current monthly spend limit
            for the combination of card and account."
          example: '10000'
          x-sor-field: accountInfo.limit accountInfo.limitCash accountInfo.cardSpending.monthlyLimit
    CardPaymentTransaction:
      type: object
      properties:
