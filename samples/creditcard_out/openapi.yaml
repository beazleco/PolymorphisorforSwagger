          $ref: '#/components/schemas/IssuedDeviceIdentifierProfile1'
        cardTransactionDateTime:
          type: string
          format: date-time
          description: The date of the transaction.
          example: 2021-08-01 14:20:10:95
          x-sor-field: transactionDate
        cardTransactionEffectiveDateTime:
          type: string
          format: date-time
          description: The date when transaction is effective from in Vertexon
          example: 2021-08-01 14:20:10:95
          x-sor-field: effectiveDate
        cardTransactionType:
          type: string
          maxLength: 4
          description: Vertexon transaction type.
          example: '1000'
          x-sor-field: transactionType
        transactionDescriptionLine1:
          type: string
          maxLength: 42
          description: Transaction description line 1.
          example: Interest Adjustment
          x-sor-field: narration1
        transactionDescriptionLine2:
          type: string
          maxLength: 25
          description: Transaction description line 2.
          example: PH
          x-sor-field: narration2
        CardTransactionAmount:
          $ref: '#/components/schemas/CardTransactionAmountForTransactionAdjustmentInitiate'
        amountQualifier:
          type: string
          maxLength: 1
          description: Transaction Role. O - original, R - reversal
          example: O
          x-sor-field: transactionRole
        DebitCreditDirection:
          $ref: '#/components/schemas/DebitCreditDirection'
        cardTransactionReference:
          type: string
          maxLength: 12
          description: Retrieval Reference Number
          example: '123459878232'
          x-sor-field: reference
      required:
      - cardTransactionType
      - cardTransactionReference
      description: Object specific to card payment transaction details
    CardPaymentTransactionItemBase:
      type: object
      properties:
        IssuedDeviceIdentifier:
          $ref: '#/components/schemas/IssuedDeviceIdentifierProfile2'
        cardTransactionDateTime:
          type: string
          format: date-time
          description: The date of the transaction.
          x-sor-fields:
          - acccountAuthorizations.authorizations.localDate
          - accountMps.mps.startDate
          - accountTransactions.transactions.transactionDate
        CardTransactionAmount:
          type: array
          items:
            $ref: '#/components/schemas/CardTransactionAmountItem'
          x-sor-field: accountMps.mps.transactionAmount
      description: Attributes of CardPaymentTransactionItem common to every operation that uses it.
    CardPaymentTransactionItem:
      allOf:
      - $ref: '#/components/schemas/CardPaymentTransactionItemBase'
      - type: object
        properties:
          cardTransactionEffectiveDateTime:
            type: string
            format: date-time
            description: The date when transaction is effective from in Vertexon
            x-sor-field: accountTransactions.transactions.effectiveDate
          CardTransactionBillingStatementReference:
            $ref: '#/components/schemas/CardTransactionBillingStatementReference'
          cardTransactionType:
            type: string
            description: Vertexon transaction type.
            x-sor-field: accountTransactions.transactions.transactionType
          transactionDescriptionLine1:
            type: string
            description: Transaction description line 1.
            x-sor-field: accountTransactions.transactions.descriptionLine1
          transactionDescriptionLine2:
            type: string
            description: Transaction description line 2.
            x-sor-field: accountTransactions.transactions.descriptionLine2
          CardTransactionPurchaseDetails:
            $ref: '#/components/schemas/CardTransactionPurchaseDetails'
          CardTransactionAuthorizationRecord:
            $ref: '#/components/schemas/CardTransactionAuthorizationRecord'
          PointOfService:
            $ref: '#/components/schemas/PointOfServiceForCardTransactionRetrieve'
          cardTransactionReference:
            type: string
            description: Retrieval Reference Number.
            x-sor-field: accountTransactions.transactions.retrievalReference
          ProductAndServiceReference:
            $ref: '#/components/schemas/ProductAndServiceReference'
          CardTransactionMerchantReference:
            $ref: '#/components/schemas/CardTransactionMerchantReference'
          systemEffectiveDate:
            type: string
            format: date-time
            description: The date when the transaction was received by Vertexon system.
            x-sor-field: accountTransactions.transactions.inputDate
      x-used-by:
      - cardTransactionRetrieve
    CardPaymentTransactionItemForCardTransactionRetrieve:
