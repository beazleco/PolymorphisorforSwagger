          statementMonth:
            type: string
            maxLength: 6
            description: Billing month format MMYYYY.
            x-sor-field: billingMonth
        required:
        - requestVariant
      description: CardTransactionRequest as served by v1/account/search/trans.
      x-sor-endpoint: v1/account/search/trans
      x-variant: '01'
      x-variant-name: Transaction Details
    CardTransactionRequestForAuthorizationTransactions:
