openapi: 3.0.3
info:
  title: Credit card Card Transaction_Retrieve
  version: 2.0.0
  description: This API will be used to retrieve details about a card account transaction
  x-generated-by: SOR Polymorphizer 6.0
  x-generated-at: '2026-09-02T13:10:38+00:00'
  x-source-sheet: Card Transaction_Retrieve
  x-polymorphism-pattern: P2
  x-bian-service-domain: Credit card
paths:
  /CreditCard/CardTransaction/Retrieve:
    post:
      operationId: cardTransactionRetrieve
      summary: This API will be used to retrieve details about a card account transaction
      tags:
      - Credit card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTransactionRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransactionResponse'
      description: This API will be used to retrieve details about a card account transaction
      x-bian-behaviour-qualifier: Card Transaction
      x-bian-equivalent-endpoint: /CreditCard/CardTransaction/Retrieve
      x-sor-endpoints: 'GET: v1/account/search/trans, GET: v1/account/search/auth, GET: /v1/account/search/mps'
components:
  schemas:
    CardTransactionRequestBase:
      type: object
      properties:
        requestVariant:
          type: string
          maxLength: 2
          enum:
          - '01'
          - '02'
          - '03'
          description: "01. Transaction Details\n02. Authorization Transactions\n03. Installment Transactions"
        IssuedDeviceIdentifier:
          type: object
          properties:
            issuedDeviceIdentification:
              type: string
              maxLength: 19
              description: The card number or card token number generated by Vertexon CMS
              x-sor-fields:
                v1/account/search/trans: cardNumber
                v1/account/search/auth: cardNumber
                /v1/account/search/mps: cardNumber
          required:
          - issuedDeviceIdentification
        currencyCode:
          type: string
          maxLength: 3
          description: Currency Code.
          x-sor-fields:
            v1/account/search/trans: currencyCode
            v1/account/search/auth: currencyCode
            /v1/account/search/mps: currencyCode
        CardTransactionAmount:
          type: object
          properties:
            amountValue:
              type: number
              description: Absolute original Transaction Amount. Number of decimals must must not be
                greater than currency exponent.
              x-sor-fields:
                v1/account/search/trans: transactionAmount
                v1/account/search/auth: transactionAmount
                /v1/account/search/mps: transactionAmount
            amountCurrencyCode:
              type: string
              maxLength: 3
              description: ISO numeric 3 digit currency code.
              x-sor-fields:
                v1/account/search/trans: transactionCurrency
                v1/account/search/auth: transactionCurrency
                /v1/account/search/mps: transactionCurrency
        cardTransactionAuthenticationCode:
          type: string
          maxLength: 6
          description: Authorization Code for transaction.
          x-sor-fields:
            v1/account/search/trans: authorizationCode
            v1/account/search/auth: authorizationCode
            /v1/account/search/mps: authorizationCode
        fromDate:
          type: string
          format: date-time
          description: Date range search – date from, based on value date (inclusive).
          x-sor-fields:
            v1/account/search/trans: dateFrom
            v1/account/search/auth: dateFrom
            /v1/account/search/mps: dateFrom
        toDate:
          type: string
          format: date-time
          description: Date range search – date to, based on value date (inclusive).
          x-sor-fields:
            v1/account/search/trans: dateTo
            v1/account/search/auth: dateTo
            /v1/account/search/mps: dateTo
        sequenceIndex:
          type: string
          description: A non-null value indicates that more information is present. This index can 
            be used in the next request as the sequenceIndex parameter.
          x-sor-fields:
            v1/account/search/trans: sequenceIndex
            v1/account/search/auth: sequenceIndex
            /v1/account/search/mps: sequenceIndex
      required:
      - requestVariant
      description: Attributes common to every variant of CardTransactionRequest.
    CardTransactionRequestForTransactionDetails:
      allOf:
      - $ref: '#/components/schemas/CardTransactionRequestBase'
