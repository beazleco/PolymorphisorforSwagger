                            /v1/account/search/mps: accountMps.mps.cardNumber
                      description: Object used to identify type of card and card details.
                    cardTransactionDateTime:
                      type: string
                      format: date-time
                      description: The date of the transaction.
                      x-sor-fields:
                        v1/account/search/trans: accountTransactions.transactions.transactionDate
                        v1/account/search/auth: acccountAuthorizations.authorizations.localDate
                        /v1/account/search/mps: accountMps.mps.startDate
                    CardTransactionAmount:
                      type: array
                      items:
                        type: object
                        properties:
                          amountValue:
                            type: string
                            x-sor-fields:
                              v1/account/search/trans: 
                                accountTransactions.transactions.billingAmount, 
                                accountTransactions.transactions.transactionAmount.amount
                              v1/account/search/auth: 
                                acccountAuthorizations.authorizations.billingAmount, 
                                acccountAuthorizations.authorizations.transactionAmount.amount
                              /v1/account/search/mps: accountMps.mps.originAmount, 
                                accountMps.mps.remPrincipal, accountMps.mps.transactionAmount.amount
                          amountCurrencyCode:
                            type: string
                            description: Currency Code for transaction amount.
                            x-sor-fields:
                              v1/account/search/trans: 
                                accountTransactions.transactions.transactionAmount.currencyCode
                              v1/account/search/auth: 
                                acccountAuthorizations.authorizations.transactionAmount.currencyCode
                              /v1/account/search/mps: accountMps.mps.transactionAmount.currencyCode
                      x-sor-fields:
                        /v1/account/search/mps: accountMps.mps.transactionAmount
                    CardTransactionAuthorizationRecord:
                      type: object
                      properties:
                        cardTransactionAuthenticationCode:
                          type: string
                          description: Authorization Code for the transaction.
                          x-sor-fields:
                            v1/account/search/trans: accountTransactions.transactions.authCode
                            v1/account/search/auth: acccountAuthorizations.authorizations.authCode
                            /v1/account/search/mps: accountMps.mps.authCode
                      description: Details of Card Transaction Authorization
                description: Array for transaction details
                x-sor-fields:
                  v1/account/search/auth: acccountAuthorizations.authorizations
                  /v1/account/search/mps: accountMps.mps
          description: Account Details
          x-sor-fields:
            v1/account/search/auth: acccountAuthorizations
            /v1/account/search/mps: accountMps
        sequenceIndex:
