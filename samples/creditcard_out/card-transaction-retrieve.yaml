                      v1/account/search/trans: accountTransactions.account
                      v1/account/search/auth: acccountAuthorizations.account
                      /v1/account/search/mps: accountMps.account
              accountCurrencyCode:
                type: string
                maxLength: 3
                description: Currency Code
                x-sor-fields:
                  v1/account/search/trans: accountTransactions.currencyCode
                  v1/account/search/auth: acccountAuthorizations.currencyCode
                  /v1/account/search/mps: accountMps.currencyCode
              CardPaymentTransaction:
                type: array
                items:
                  type: object
                  properties:
                    IssuedDeviceIdentifier:
                      type: object
                      properties:
                        issuedDeviceIdentification:
                          type: string
                          maxLength: 19
                          description: Identifier representing the issued device.
                          x-sor-fields:
