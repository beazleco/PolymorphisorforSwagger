openapi: 3.0.3
info:
  title: Credit Card Card Cancel
  version: 2.0.0
  description: This API will be used to cancel a card with specified reason or cancellation code
  x-generated-by: SOR Polymorphizer 6.0
  x-generated-at: '2026-09-02T13:10:38+00:00'
  x-source-sheet: Card Cancel
  x-polymorphism-pattern: P1
