  parameters:
    Authorization:
      name: Authorization
      in: header
      description: |-
        Standard header. Types can be basic, bearer, apikey etc. Consumer will set the authorization type and credentials. Apigee will handle validation against an identity service for basic authorization, OAuthV2 for bearer token authorization and apikeys policy validation.
        Examples:
        Basic
        Authorization: Basic bXl1c2VyOm15cGFzc3dvcmQxMjM=
        Bearer
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        ApiKey
        Authorization: ApiKey 1a2b3c4d5e6f7g8h9i0j
      required: true
      style: simple
      explode: false
      schema:
        type: string
    x-BDO-Client-Request-Id:
      name: x-BDO-Client-Request-Id
      in: header
      description: |-
        The unique id (preferable uuidv4) provided by the client for a specific HTTP request.
        Channel Reference Number. This should be unique value within the channel. Required if other Otel (open telemetry) field are not provided.
      required: false
      style: simple
      explode: false
      schema:
        type: string
    x-BDO-Client-Request-Trace-Id:
      name: x-BDO-Client-Request-Trace-Id
      in: header
      description: "The unique identifier for an entire trace in OpenTelemetry (OTEL). \nA trace represents a single request\
        \ or transaction as it flows through multiple services in a distributed system. (e.g. 5b8aa5a2d2c872e8321cf37308d69df2)\n\
        Only Mandatory if Request Id is not provided"
      required: false
      style: simple
      explode: false
      schema:
        type: string
