openapi: 3.0.3
info:
  title: Issued Device Administration
  version: 1.0.8
  description: |-
    The issued device admin domain enables the bank to create, issue and manage cards throught their lifecycle.It supports card creation, updates, activation, status management, replacement, renewal, account association, card inquiry and didgital card operations
servers:
- url: https://localhost/
paths:
  /issued-device-administration/token-assignment/search:
    post:
      summary: Token Search API
      description: |-
        **<u>API Lifecycle Status - Design</u>**

        This request is used by the issuer backend to search for digital cards in D1 using digital PAN as lookup and retrieve card & end user related details
      tags:
      - BQ - Token Assignment
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/x-BDO-Client-Request-Id'
      - $ref: '#/components/parameters/x-BDO-Client-Request-Trace-Id'
      - $ref: '#/components/parameters/x-BDO-Client-Request-Span-Id'
      - $ref: '#/components/parameters/x-BDO-API-Version'
      - $ref: '#/components/parameters/x-BDO-End-Consumer-IP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCardDetailsRetrieveRequest'
      responses:
        '200':
          description: Success
          headers:
            x-BDO-Client-Request-Id:
              schema:
                type: string
              description: The unique id (preferable uuidv4) provided by the client for a specific HTTP request.
            x-BDO-Client-Request-Trace-Id:
              schema:
                type: string
              description: "The unique identifier for an entire trace in OpenTelemetry (OTEL). \nA trace represents a single\
                \ request or transaction as it flows through multiple services in a distributed system."
            x-BDO-Client-Request-Span-Id:
              schema:
                type: string
              description: "Uniquely identifies a single span within a trace. A span represents one unit of work \n(e.g.,HTTP\
                \ Request, a database query). (e.g. 5fb397be34d26b51)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCardDetailsRetrieveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
