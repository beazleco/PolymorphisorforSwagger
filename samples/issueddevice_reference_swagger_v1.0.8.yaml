components:
  schemas:
    TokenCardDetailsRetrieveRequest:
      type: object
      properties:
        correlationIdentification:
          type: string
          maxLength: 64
          description: |-
            Random identifier which can be used to correlate the different API calls done as part of a single use-case. This identifier will be the one primarily used for troubleshooting.
            There is no strong guarantee of the uniqueness of this identifier, so please refrain from using it for other purpose than logging and troubleshooting.
        PartyIdentifier:
          $ref: '#/components/schemas/PartyIdentifier'
        EncryptedDataCriteria:
          $ref: '#/components/schemas/EncryptedDataCriteria'
    PartyIdentifier:
      type: object
      description: A unique identifier used to distinguish the party within the organization or external systems.
      properties:
        partyIdentificationType:
          type: string
          description: It specifies the type of party
        partyIdentification:
          type: string
          maxLength: 10
          description: The ID of the issuer
        partyIdentificationMasked:
          type: string
          description: Masked ID of the issuer
      required:
      - partyIdentification
    EncryptedDataCriteria:
      type: object
      description: Encrypted Data Criteria
      properties:
        encryptedCardData:
          type: string
          maxLength: 8192
          description: Ciphered digital PAN, it is encrypted using JWE. The digital pan value has a length up to 19
          example: 9GszhPm1Afe6vvCyrvopAS2=
        searchType:
          type: string
          description: |-
            Possible Values:
            Encrypted Data
          example: encryptedData
      required:
      - encryptedCardData
    TokenCardDetailsRetrieveResponse:
      type: object
      properties:
        PartyIdentifier:
          type: object
          description: A unique identifier used to distinguish the party within the organization or external systems.
          properties:
            partyIdentificationType:
              type: string
              description: It specifies the type of identification
            partyIdentification:
              type: string
              description: Unique identifier of the consumer
              example: D7IGeiLWfDGxKZbE3ZOz
            partyIdentificationMasked:
              type: string
              description: Masked ID of the consumer
        TokenIdentifier:
          $ref: '#/components/schemas/TokenIdentifier'
        DeviceIdentifier:
          $ref: '#/components/schemas/DeviceIdentifier'
    TokenIdentifier:
      type: object
      description: It specifies the token identification
      properties:
        tokenIdentification:
          type: string
          description: Unique identifier of the digital card
          example: 2cjc
    DeviceIdentifier:
      type: object
      description: The type is issued device admin
      properties:
        deviceIdentificationType:
          type: string
          description: It specifies the type of device Id
        deviceIdentification:
          type: string
          description: Unique identifier of the device Id
          example: EkcZuzvEc
    TokenCredentialsRequest:
      type: object
      properties:
        correlationIdentification:
          type: string
          maxLength: 64
          description: |-
            Random identifier which can be used to correlate the different API calls done as part of a single use-case. This identifier will be the one primarily used for troubleshooting.
            There is no strong guarantee of the uniqueness of this identifier, so please refrain from using it for other purpose than logging and troubleshooting.
        PartyIdentifier:
          type: object
          description: A unique identifier used to distinguish the party within the organization or external systems.
          properties:
            partyIdentificationType:
              type: string
              description: It specifies the type of party
            partyIdentification:
              type: string
              maxLength: 10
              description: The ID of the issuer
            partyIdentificationMasked:
              type: string
              description: Masked ID of the issuer
          required:
          - partyIdentification
        TokenIdentifier:
          type: object
          description: It specifies the token identification
          properties:
            tokenIdentification:
              type: string
              maxLength: 64
              description: Unique identifier of the digital card
          required:
          - tokenIdentification
    TokenCredentialsResponse:
      type: object
      properties:
        tokenCredentials:
          type: string
          description: |-
            The field is the json (cf http://www.json.org/ ) representation of the DIGITAL card. JWE encryption is used to secure the field (please refer to the Encrypt sensitive data for more details) Details:
            {
            "pan":"...",
            "exp":"..."
            }
            The PAN is Mandatory, up to 19 digits.
            The expiry date in the format MMYY. It is not provided for UPI scheme.
    TokenDetailsRetrieveRequest:
      type: object
      properties:
        correlationIdentification:
          type: string
          maxLength: 64
          description: |-
            Random identifier which can be used to correlate the different API calls done as part of a single use-case. This identifier will be the one primarily used for troubleshooting.
            Warning: This identifier should not be derived from sensitive personal data, as its value will be logged in clear.
            There is no strong guarantee of the uniqueness of this identifier, so please refrain from using it for other purpose than logging and troubleshooting.
        PartyIdentifier:
          type: object
          description: A unique identifier used to distinguish the party within the organization or external systems.
          properties:
            partyIdentificationType:
              type: string
              description: Type of issuer id identification
            partyIdentification:
              type: string
              maxLength: 10
              description: The id of the issuer
            partyIdentificationMasked:
              type: string
              description: The id of the issuer masked
          required:
          - partyIdentification
        TokenIdentifier:
          type: object
          description: It specifies the token identification
          properties:
            tokenIdentification:
              type: string
              maxLength: 64
              description: The id of the digital card
          required:
          - tokenIdentification
    TokenDetailsRetrieveResponse:
      type: object
      description: Provides information about the token. Note that this data is available only if the tokenization is successful
        or pending.
      properties:
        CardIdentifier:
          $ref: '#/components/schemas/CardIdentifier'
        TokenIdentifier:
          type: object
          description: It specifies the token identification
          properties:
            tokenIdentification:
              type: string
              description: Unique identifier of the token specified by the TSP
        pANSuffix:
          type: string
          description: Last four digits of the token
        Token:
          $ref: '#/components/schemas/Token'
        deviceBindingList:
          type: array
          items:
            type: string
          description: List of all devices bound to this token. A device is represented by its binding reference.
        lastUpdateDateTime:
          type: string
          format: date-time
          description: The last time the token status has been changed. Format ISO 8601 YYYY-MM-DDThh:mm:ssTZD
        provisioningDateTime:
          type: string
          format: date-time
          description: The provisioning time of the token. Format ISO 8601 YYYY-MM-DDThh:mm:ssTZD
        lastReplenishDateTime:
          type: string
          format: date-time
          description: The last time the token keys have been reset. Format ISO 8601 YYYY-MM-DDThh:mm:ssTZD
        TokenRequestorInformation:
          $ref: '#/components/schemas/TokenRequestorInformation'
        DeviceInformation:
          $ref: '#/components/schemas/DeviceInformation'
    CardIdentifier:
      type: object
      description: The type is issued device admin
      properties:
        issuedDeviceIdentificationType:
          type: string
          description: It specifies the type of card id
        issuedDeviceIdentification:
          type: string
          description: Unique identifier of the card.
          example: yI
        issuedDeviceIdentificationMasked:
          type: string
          description: Masked Id of the card
    Token:
      type: object
      description: It specifies the token details
      properties:
        tokenIdentificationCode:
          type: string
          description: It specifies the token identification code
        tokenType:
          type: string
          description: |-
            The type of the token. Following values are supported:
            Possible Values:
            SE,
            HCE,
            COF,
            ECOM,
            QRC
        tokenStatus:
          type: string
          description: |-
            The state of the digital card (Token)
            Possible Values:
            Active,
            Inactive,
            Deleted,
            Deployment_Ongoing,
            Pending_Activation
          example: Active
        tokenRequestColour:
          type: string
          description: It specifies the token request color
    TokenRequestorInformation:
      type: object
      description: It provides token requestor information
      properties:
        identifier:
          type: string
          description: Digital Card requestor identifier. This is provided by the TSP itself.
        walletIdentification:
          type: string
          description: Mastercard ONLY. Wallet application identifier
        name:
          type: string
          description: Wallet or Merchant human readable name
        tspId:
          type: string
          description: VISA ONLY. Identifiers of the couple Token Requestor - Token Service Provider
        originalTokenRequestorIdentification:
          type: string
          description: Applied only to VISA in case of token for token provisioning
    PhoneAddress:
      type: object
      description: it specifies the phone number details
      properties:
        phoneAddressType:
          type: string
          description: |-
            Possible Values:
            -Home Number
            -Phone Number
            -Fax Number
            -Work Number
            Default Value: Phone Number
          example: Phone Number
        phoneNumber:
          type: string
          description: Device phone number
        countryCode:
          type: string
          description: International dialing code
        phoneExtension:
          type: string
          description: Phone extension
        lastUpdateDate:
          type: string
          description: It specifies the last updated date of mobile number
        fourLastDigitPhoneNumber:
          type: string
          description: Last four digits of device phone number
    DeviceInformation:
      type: object
      description: It specifies Device information
      properties:
        DeviceIdentifier:
          type: object
          description: Type is Issued Device Admin
          properties:
            deviceIdentificationType:
              type: string
              description: |-
                Type of the token storage location. Following values are possible:
                HCE,
                Spay Phone,
                Spay Watch,
                Spay Tablet,
                Spay TV,
                Iphone,
                Iwatch,
                Ipad,
                Mac Book,
                Android Phone,
                Android Tablet,
                Android Watch,
                Mobile Phone,
                Tablet,
                Watch,
                Mobile Phone or Tablet,
                Bracelet,
                Unknown
              example: Watch
            deviceIdentification:
              type: string
              description: Identifier of the token storage
        PhoneAddress:
          $ref: '#/components/schemas/PhoneAddress'
        manufacturer:
          type: string
          description: Device manufacturer name
        brand:
          type: string
          description: Device brand
        model:
          type: string
          description: Device model
        operatingSystemVersion:
          type: string
          description: Device OS version
        firmwareVersion:
          type: string
          description: Device firmware version
        deviceName:
          type: string
          description: Device name set by the consumer
        deviceParentIdentification:
          type: string
          description: ID of parent device. Applies to wearable
        language:
          type: string
          description: Language set on the device in ISO 639-3
        serialNumber:
          type: string
          description: Device serial number
        timeZone:
          type: string
          description: 'Device time zone abbreviation. Example: PST, GMT, etc…'
        timeZoneSetting:
          type: string
          description: "Who has set the timezone. \nPossible values:\nNetwork Set,\nConsumer Set"
          example: Network Set
        sIMSerialNumber:
          type: string
          description: Secure Element serial number
        iMEI:
          type: string
          description: IMEI number of device
        networkType:
          type: string
          description: |-
            Network Type Possible Values:
            Cellular,
            Wifi
          example: Cellular
        networkOperator:
          type: string
          description: Network operator name
    TokenResumeRequest:
      type: object
      properties:
