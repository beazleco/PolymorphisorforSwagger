      properties:
        accountType:
          type: string
          description: "Specifies the classification of the account based on its purpose or usage.\nDD-Current Account\nSV-Savings Account"
          example: DD
          x-sor-field: depAcctId.acctType
        CustomerReference:
          type: array
          description: Array of customer relation details
          items:
            type: object
            properties:
              party:
                type: object
                description: Party details
                properties:
                  Partyidentifier:
                    type: object
                    description: Object to identify customer number
                    properties:
                      partyIdentification:
                        type: string
                        maxLength: 10
                        description: The permanent customer number identifying a party associated with the deposit account
                        example: '0014308593'
                        x-sor-field: depAcctInfo.custRelation.custPermId.custPermId
                    required:
                    - partyIdentification
                  partyRole:
                    type: object
                    description: Party Role Details
                    properties:
                      partyInvolvementType:
                        type: string
                        maxLength: 3
                        description: A code indicating the relationship type of the customer to the deposit account (e.g. primary owner, joint owner, beneficiary)
                        example: OWN
                        x-sor-field: depAcctInfo.custRelation.relationCode
                    required:
                    - partyInvolvementType
        ProductInstanceReference:
          type: object
          description: Identifies product Id associated with the account
          properties:
            ProductReference:
              type: object
              description: Product Reference details
              properties:
                ProductIdentifier:
                  type: object
                  description: Product Identifier
                  properties:
                    ProductIdentification:
                      type: string
                      maxLength: 5
                      description: The product identifier indicating which deposit product template is associated with this account
                      x-sor-field: depAcctInfo.depAcctBasic.prodId
                  required:
                  - ProductIdentification
        BranchReference:
          type: object
          description: Branch Details
          properties:
            branchIdentification:
              type: string
              maxLength: 5
              description: The identifier of the branch where the deposit account is held or was opened
              example: '6700'
              x-sor-field: depAcctInfo.depAcctBasic.branchId
          required:
          - branchIdentification
        userReference:
          type: string
          description: The code identifying the primary bank officer responsible for the deposit account
          x-sor-field: primOfficerCode
        Account:
          type: object
          description: Account Details
          properties:
            openDate:
              type: string
              format: date
              description: Account opening date
              x-sor-field: depAcctInfo.depAcctBasic.openDt
            UserDefinedFields:
              type: object
              description: User Defined Fields
              properties:
                userFieldName:
                  type: string
                  maxLength: 11
                  description: Name of a user-defined field associated with the deposit account
                  x-sor-field: depAcctInfo.depUserDefinedFields.userFieldName
                userFieldValue:
                  type: string
                  maxLength: 1
                  description: Value of a user-defined field associated with the deposit account
                  x-sor-field: depAcctInfo.depUserDefinedFields.userFieldValue
              required:
              - userFieldName
              - userFieldValue
            LocalFields:
              type: object
              description: Local fields details
              properties:
                referenceNo:
                  type: string
                  description: A local reference number used to identify or track the account opening request within the SOR system
                  x-sor-field: localFields.referenceNo
                chequeBookFlag:
                  type: string
                  description: Flag indicating whether a cheque book is associated with or requested for the account
                  x-sor-field: localFields.chequeBookFlag
              required:
              - referenceNo
              - chequeBookFlag
          required:
          - openDate
        LimitArrangement:
          type: object
          description: Reference to credit line details
          properties:
            CreditLineReference:
              type: array
              description: Array of credit lines associated with the account
              items:
                type: object
                properties:
                  creditLineIdentification:
                    type: string
                    maxLength: 11
                    description: The identifier of the credit line associated with the deposit account
                    x-sor-field: depAcctInfo.indirectLiabilities.creditLine.creditLineId
                  subCreditLineIdentification:
                    type: string
                    maxLength: 11
                    description: The identifier of a sub-credit line under the main credit line associated with the deposit account
                    x-sor-field: depAcctInfo.indirectLiabilities.creditLine.subCreditLineId
                required:
                - creditLineIdentification
                - subCreditLineIdentification
            liabilityType:
              type: string
              description: Type of indirect liability associated with the account (e.g. guarantor, co-signer)
              x-sor-field: depAcctInfo.indirectLiabilities.liabilityType
            Partyidentifier:
              type: object
              description: Object to identify customer number
              properties:
                partyIdentification:
                  type: string
                  maxLength: 10
                  description: Permanent customer identifier of the party associated with an indirect liability on the account
                  example: '0014308593'
                  x-sor-field: depAcctInfo.indirectLiabilities.custPermId
              required:
              - partyIdentification
            MaximumLiabilityAmount:
              type: object
              description: Maximum liability amount details
              properties:
                amountValue:
                  type: integer
                  description: Maximum liability amount for the indirect liability associated with the account
                  example: '250'
                  x-sor-field: depAcctInfo.indirectLiabilities.maxLiability.amt
              required:
              - amountValue
            taxLiabilityPercentage:
              type: integer
              description: Tax liability percentage amount applicable to the indirect liability on the account
              example: '25'
              x-sor-field: depAcctInfo.indirectLiabilities.taxLiabilityPctAmt
          required:
          - liabilityType
          - taxLiabilityPercentage
      required:
      - accountType
