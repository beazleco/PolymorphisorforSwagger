              description: The unique identifier for an entire trace in OpenTelemetry (OTEL). A trace represents a single request or transaction as it flows through multiple services in a distributed system. (e.g. 5b8aa5a2d2c872e8321cf37308d69df2)
            x-BDO-Client-Request-Span-Id:
              schema:
