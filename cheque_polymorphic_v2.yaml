openapi: 3.0.3
info:
  title: Cheque Processing
  version: 1.0.0
  description: |-
    **<u>API Lifecycle Status - Design</u>**

    API specification for Cheque Processing
  x-sor-polymorphizer:
    summary: 8 non-SOR attributes eliminated; 1 groups polymorphized; 1 inline objects de-duplicated.
    eliminatedAttributes:
    - AccountIdentifier.accountIdentificationType  (Not Used In SOR / blank)
    - ChequeImage.Image Description  (Not Used In SOR / blank)
    - Amount.amountType  (absent-from-mapping)
    - ChequeItem.chequeReferenceNumber  (absent-from-mapping)
    - Account.accountNickName  (absent-from-mapping)
    - Account.accountOpenDate  (absent-from-mapping)
    - ChequeSubmissionResponse.ChequeItem[].chequeReferenceNumber  (absent-from-mapping)
    - ChequeEnquiryResponse.ChequeItem[].chequeReferenceNumber  (absent-from-mapping)
    polymorphism:
    - Base ChequeProcessingResultBase holds common ['ChequeItem'] + discriminator 'resultContext'.
    - ChequeSubmissionResponse -> allOf[ChequeProcessingResultBase]
    - ChequeEnquiryResponse -> allOf[ChequeProcessingResultBase, +['ChequeLifestyleStatus']]
    deduplication:
    - ChequeEnquiryRequest.chequeProcessingOperatingSession -> $ref chequeProcessingOperatingSession (identical shape)
servers:
- url: https://localhost/
paths:
  /ChequeProcessing/Initiate:
    post:
      summary: Cheque Submission
      description: |-
        **<u>API Lifecycle Status - Design</u>**

        Submit a cheque for processing and clearing
      tags:
      - BQ - ChequeProcessingOperatingSession
      parameters:
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/x-BDO-Client-Request-Id'
      - $ref: '#/components/parameters/x-BDO-Client-Request-Trace-Id'
      - $ref: '#/components/parameters/x-BDO-Client-Request-Span-Id'
      - $ref: '#/components/parameters/x-BDO-API-Version'
      - $ref: '#/components/parameters/x-BDO-End-Consumer-IP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChequeSubmissionRequest'
      responses:
        '200':
          description: Success
          headers:
            x-BDO-Client-Request-Id:
              schema:
                type: string
              description: The unique id (preferrable uuidv4) provided by the client for a specific HTTP request.
            x-BDO-Client-Request-Trace-Id:
              schema:
                type: string
              description: The unique identifier for an entire trace in OpenTelemetry (OTEL). A trace represents a single request or transaction as it flows through multiple services in a distributed system. (e.g. 5b8aa5a2d2c872e8321cf37308d69df2)
            x-BDO-Client-Request-Span-Id:
              schema:
                type: string
              description: Uniquely identifies a single span within a trace. A span represents one unit of work (e.g., an HTTP request, a database query). (e.g. 5fb397be34d26b51)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChequeSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /ChequeProcessing/{chequeprocessingid}/Retrieve:
    get:
      summary: Cheque Enquiry
      description: |-
        **<u>API Lifecycle Status - Design</u>**

        Initiate Cheque Processing
      tags:
      - BQ - ChequeProcessingOperatingSession
      parameters:
      - $ref: '#/components/parameters/Authorization'
